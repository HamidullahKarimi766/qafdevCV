<!DOCTYPE html>
<html lang="fa" dir="rtl" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>انتخاب قالب رزومه | QafCV</title>
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <script>
        tailwind.config = { darkMode: 'class', theme: { extend: { fontFamily: { sans: ['Vazirmatn', 'sans-serif'] }, colors: { primary: { 50: '#eef2ff', 500: '#6366f1', 600: '#4f46e5', 700: '#4338ca' } } } } }
    </script>
    <style>
        body { font-family: 'Vazirmatn', sans-serif; }
        [x-cloak] { display: none !important; }
        .template-card { transition: all 0.3s ease; }
        .template-card:hover { transform: translateY(-5px); }
        .template-card:hover .mockup-overlay { opacity: 1; }
        .mockup-overlay { transition: opacity 0.3s ease; }
    </style>
</head>
<body class="font-sans bg-slate-100 dark:bg-slate-950 text-slate-800 dark:text-slate-200 transition-colors duration-300">

    <header class="h-16 bg-white dark:bg-slate-900 border-b border-slate-200 dark:border-slate-800 flex items-center justify-between px-6 sticky top-0 z-30">
        <div class="flex items-center space-x-3 space-x-reverse">
            <a href="dashboard.html" class="text-slate-500 hover:text-primary-600 transition">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
            </a>
            <h1 class="text-lg font-bold hidden sm:block">انتخاب قالب رزومه</h1>
        </div>
        <button class="inline-flex items-center px-4 py-2 text-sm font-semibold text-white bg-primary-600 hover:bg-primary-700 rounded-lg shadow-lg shadow-primary-600/30 transition">ادامه ویرایش</button>
    </header>

    <div class="max-w-6xl mx-auto px-4 py-10">
        <div class="text-center mb-12">
            <h2 class="text-3xl font-extrabold mb-2">قالب خود را انتخاب کنید</h2>
            <p class="text-slate-500">قالبی که با شخصیت حرفه‌ای شما هم‌خوانی دارد را انتخاب کنید</p>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6">
            
            <!-- Template 1: Modern Blue (Active) -->
            <div class="template-card relative cursor-pointer ring-4 ring-primary-500 rounded-2xl overflow-hidden">
                <div class="relative overflow-hidden h-96 bg-white border-b border-slate-100">
                    <div class="absolute top-0 right-0 w-2/3 h-full bg-primary-600"></div>
                    <div class="absolute top-0 left-0 w-1/3 h-full p-4 flex flex-col justify-center space-y-2">
                        <div class="w-16 h-16 rounded-full bg-slate-200 mx-auto"></div>
                        <div class="h-2 w-full bg-slate-200 rounded"></div>
                    </div>
                    <div class="absolute top-0 right-0 w-2/3 h-full p-4 space-y-2">
                        <div class="h-2 w-1/2 bg-white/80 rounded"></div>
                        <div class="mt-4 space-y-1.5"><div class="h-1.5 w-full bg-white/40 rounded"></div></div>
                    </div>
                    <!-- Overlay -->
                    <div class="mockup-overlay absolute inset-0 bg-slate-900/70 flex items-center justify-center opacity-0">
                        <button class="px-4 py-2 bg-white text-primary-700 font-bold rounded-lg text-sm">استفاده از قالب</button>
                    </div>
                </div>
                <div class="p-4 bg-white dark:bg-slate-900 flex justify-between items-center">
                    <span class="font-bold text-sm">Modern Blue</span>
                    <span class="text-xs bg-primary-50 text-primary-600 px-2 py-1 rounded-full">انتخاب شده</span>
                </div>
            </div>

            <!-- Template 2: Minimal White -->
            <div class="template-card relative cursor-pointer rounded-2xl overflow-hidden border border-slate-200 dark:border-slate-800">
                <div class="relative overflow-hidden h-96 bg-white">
                    <div class="p-6 space-y-4">
                        <div class="text-center border-b border-slate-200 pb-4 space-y-2">
                            <div class="w-20 h-20 rounded-full bg-slate-100 mx-auto"></div>
                            <div class="h-3 w-32 bg-slate-300 rounded mx-auto"></div>
                        </div>
                        <div class="space-y-2">
                            <div class="h-2 w-1/4 bg-slate-300 rounded"></div>
                            <div class="h-1.5 w-full bg-slate-100 rounded"></div>
                        </div>
                    </div>
                    <div class="mockup-overlay absolute inset-0 bg-slate-900/70 flex items-center justify-center opacity-0">
                        <button class="px-4 py-2 bg-white text-primary-700 font-bold rounded-lg text-sm">استفاده از قالب</button>
                    </div>
                </div>
                <div class="p-4 bg-white dark:bg-slate-900">
                    <span class="font-bold text-sm">Minimal White</span>
                </div>
            </div>

            <!-- Template 3: Professional Dark -->
            <div class="template-card relative cursor-pointer rounded-2xl overflow-hidden border border-slate-200 dark:border-slate-800">
                <div class="relative overflow-hidden h-96 bg-slate-900">
                    <div class="absolute top-0 right-0 w-1/3 h-full bg-slate-800 p-4 flex flex-col items-center space-y-3 pt-8">
                        <div class="w-16 h-16 rounded-full bg-slate-700"></div>
                    </div>
                    <div class="absolute top-0 left-0 w-2/3 h-full p-4 space-y-2">
                        <div class="h-2 w-1/2 bg-slate-700 rounded"></div>
                        <div class="mt-4 h-2 w-1/3 bg-primary-500 rounded"></div>
                    </div>
                    <div class="mockup-overlay absolute inset-0 bg-slate-900/80 flex items-center justify-center opacity-0">
                        <button class="px-4 py-2 bg-white text-primary-700 font-bold rounded-lg text-sm">استفاده از قالب</button>
                    </div>
                </div>
                <div class="p-4 bg-white dark:bg-slate-900">
                    <span class="font-bold text-sm">Professional Dark</span>
                </div>
            </div>

            <!-- Template 4: Creative -->
            <div class="template-card relative cursor-pointer rounded-2xl overflow-hidden border border-slate-200 dark:border-slate-800">
                <div class="relative overflow-hidden h-96 bg-white">
                    <div class="absolute top-0 inset-x-0 h-1/3 bg-gradient-to-r from-rose-400 to-orange-400"></div>
                    <div class="absolute top-1/4 right-6 w-20 h-20 rounded-full bg-white p-1">
                        <div class="w-full h-full rounded-full bg-slate-200"></div>
                    </div>
                    <div class="absolute bottom-0 inset-x-0 h-2/3 p-4 space-y-2">
                        <div class="mt-8 h-2 w-1/2 bg-slate-300 rounded"></div>
                        <div class="h-1.5 w-full bg-slate-100 rounded"></div>
                        <div class="flex space-x-2 space-x-reverse pt-2">
                            <div class="w-12 h-12 bg-rose-100 rounded-lg"></div>
                            <div class="w-12 h-12 bg-orange-100 rounded-lg"></div>
                        </div>
                    </div>
                    <div class="mockup-overlay absolute inset-0 bg-slate-900/80 flex items-center justify-center opacity-0">
                        <button class="px-4 py-2 bg-white text-primary-700 font-bold rounded-lg text-sm">استفاده از قالب</button>
                    </div>
                </div>
                <div class="p-4 bg-white dark:bg-slate-900">
                    <span class="font-bold text-sm">Creative</span>
                </div>
            </div>

        </div>
    </div>

    

</body>
</html>
